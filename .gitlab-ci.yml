# .gitlab-ci.yml

# Inherits a Gitlab token from the Golang group.
# Only works on protected branches and tags.
# Suggested branch RegEx:
# - main
# - master
# - dev-*
# Suggested tag RegEx:
# - *-alpha*
# - *-release

# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
  - test
  - release

sast:
  stage: test
  when: on_success
include:
  - template: Security/SAST.gitlab-ci.yml

release:
  stage: release
  when: on_success
  image: docker:stable
  services:
    - docker:dind

  # Only run this release job for (protected) tags, not every commit.
  only:
    refs:
      - tags
    variables:
      - $CI_COMMIT_REF_PROTECTED

  variables:
    # Optionally use GitLab's built-in image registry.
    DOCKER_REGISTRY: $CI_REGISTRY
    DOCKER_USERNAME: $CI_REGISTRY_USER
    DOCKER_PASSWORD: $CI_REGISTRY_PASSWORD

    # Or, use any registry, including the official one.
    # DOCKER_REGISTRY: https://index.docker.io/v1/

    # Disable shallow cloning so that goreleaser can diff between tags to
    # generate a changelog.
    GIT_DEPTH: 0

  script: |
    # GITLAB_TOKEN is needed to create GitLab releases.
    # DOCKER_* are needed to push Docker images.
    docker run --rm --privileged \
      -v $PWD:/go/src/gitlab.com/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME \
      -w /go/src/gitlab.com/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -e DOCKER_USERNAME -e DOCKER_PASSWORD -e DOCKER_REGISTRY  \
      -e GITLAB_TOKEN \
      -e CI_API_V4_URL \
      -e CI_PROJECT_ID \
      goreleaser/goreleaser release --clean
